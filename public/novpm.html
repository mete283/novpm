
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>noVPN</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent; /* Mobil mavi dokunma efektini kaldırır */
      outline: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* One UI / iOS Kapsül Arama Barı */
    .header-container {
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .capsule-bar {
      width: 100%;
      max-width: 600px;
      height: 48px;
      background: #f1f3f5;
      border-radius: 24px; /* Tam kapsül yapı */
      display: flex;
      align-items: center;
      padding: 4px 6px 4px 18px;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.04);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1.5px solid transparent;
    }

    .capsule-bar:focus-within {
      background: #ffffff;
      border-color: #007aff;
      box-shadow: 0 4px 16px rgba(0, 122, 255, 0.15);
    }

    input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 15px;
      font-weight: 500;
      color: #1c1c1e;
      padding: 0;
    }

    input::placeholder {
      color: #8e8e93;
      font-weight: 400;
    }

    button {
      height: 36px;
      padding: 0 20px;
      border-radius: 18px; /* Buton kapsül yapı */
      border: none;
      background: #007aff;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:active {
      transform: scale(0.94);
      background: #0062cc;
    }

    /* Web View Alanı */
    .frame-wrapper {
      flex: 1;
      width: 100%;
      background: #ffffff;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <div class="header-container">
    <div class="capsule-bar">
      <input type="text" id="urlInput" placeholder="Aramak istediğiniz site URL'si..." autocomplete="off" spellcheck="false">
      <button onclick="loadSite()">Git</button>
    </div>
  </div>

  <div class="frame-wrapper">
    <iframe id="proxyFrame" src="about:blank"></iframe>
  </div>

  <script>
    function loadSite() {
      let target = document.getElementById('urlInput').value.trim();
      if (!target) return;
      
      if (!target.startsWith('http://') && !target.startsWith('https://')) {
        target = 'https://' + target;
      }

      // Test amaçlı cors proxy adresi
      const proxyUrl = "https://api.allorigins.win/raw?url=";
      document.getElementById('proxyFrame').src = proxyUrl + encodeURIComponent(target);
    }

    // Enter tuşuna basıldığında çalıştırma
    document.getElementById('urlInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        loadSite();
      }
    });
  </script>

</body>
</html>
